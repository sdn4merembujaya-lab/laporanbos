<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Aplikasi Laporan BOS</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1d2430;--m:#667085;--b:#d9dee7;--a:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--c:#1b212a;--t:#e8ecf1;--m:#98a2b3;--b:#2c3542;--a:#0f766e}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;background:var(--a);color:#fff}h1{font-size:17px;margin:0}header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--c);border-bottom:1px solid var(--b)}nav button{white-space:nowrap}
label select{width:100%;padding:7px;border:1px solid var(--b);border-radius:7px;background:var(--bg);color:var(--t);font:inherit}
main{padding:12px;max-width:1100px;margin:auto}button,input{font:inherit}
button{border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 10px;border-radius:7px;cursor:pointer;margin:1px}
button.p,nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--m)}input{width:100%;padding:7px;border:1px solid var(--b);border-radius:7px;background:var(--bg);color:var(--t)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--bg)}.r{text-align:right;white-space:nowrap}.sg td{background:var(--bg);font-weight:600}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.65);overflow:auto;display:none;z-index:9;padding:env(safe-area-inset-top,0px) 8px}
#pv .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;justify-content:center}
.paper{background:#fff;color:#000;max-width:800px;margin:0 auto 20px;padding:30px 36px;font:13px/1.5 "Times New Roman",serif}
.paper table{border-collapse:collapse;width:100%}.paper th,.paper td{border:1px solid #000;padding:3px 6px;color:#000;background:none}.paper th{background:#eee}.paper .nb td{border:0;padding:2px 4px}
.kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:12px}.kop b{font-size:15px}
.ttd{display:flex;justify-content:space-around;margin-top:24px;text-align:center}.ttd div{min-width:30%}
@media print{body>*:not(#pv){display:none!important}#pv{position:static;background:none;display:block;padding:0}.bar{display:none!important}.paper{margin:0;padding:0;max-width:none}}

header{padding:16px 18px;background:linear-gradient(135deg,#0f766e,#115e59)}h1{font-size:19px;letter-spacing:.2px}
#who{margin-top:6px}#who small{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}#who button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
nav{position:sticky;top:0;z-index:5;box-shadow:0 1px 6px rgba(0,0,0,.08);scrollbar-width:thin}nav button{padding:8px 12px;border-radius:999px}
.card{box-shadow:0 1px 3px rgba(16,24,40,.06);border-radius:12px;padding:14px}button.p{font-weight:600}button:hover{filter:brightness(.96)}
input:focus,select:focus{outline:2px solid var(--a);outline-offset:0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}.st div{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:10px}.st small{color:var(--m);display:block}.st b{font-size:17px}
.bar2{height:10px;background:var(--bg);border:1px solid var(--b);border-radius:99px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--a)}
.eye{margin-top:4px;font-size:12px}
@media(max-width:640px){main{padding:8px}.card{padding:10px}button{padding:9px 12px}input,select{font-size:16px}main table{display:block;overflow-x:auto;white-space:nowrap}h1{font-size:17px}}
</style></head><body>
<header><h1>Aplikasi Laporan BOS</h1><small>BKU, Kwitansi, Invois, BAST, SPPD, Surat Tugas dan Laporan, dari RPD</small><div id="who" style="margin-top:4px"></div></header>
<nav id="nav"></nav><main id="m"></main><div id="pv"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="akses.js"></script>
<script>
let SNP=[],G=[],R=[];
const K='bos_v1',$=s=>document.querySelector(s),rp=n=>(+n||0).toLocaleString('id-ID'),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=[R,SNP,G];let N,TOT;const calc=()=>{R=S.R||DEF[0];SNP=S.SNP||DEF[1];G=S.G||DEF[2];N=R.map(r=>r[4]*r[6]);TOT=N.reduce((a,b)=>a+b,0)};const NS=6,SL=['Triwulan 1','Triwulan 2','Triwulan 3','Triwulan 4','Tahap I','Tahap II'],SPER=['t:1','t:2','t:3','t:4','h:1','h:2'],IDK=['sek','sekk','sing','npsn','alamat','kec','kab','prov','kodepos','dinas','kota','kep','nipk','pkk','ben','nipb','pem','nipp','kom','kabid','nipkabid','telp','tahun','logoL','logoR'];
let SH={v:{sek:'',npsn:'',alamat:'',kec:'',kab:'',kota:'',kep:'',nipk:'',ben:'',nipb:'',tahun:'2026'}};
const lnk=a=>{IDK.forEach(k=>Object.defineProperty(a.s,k,{get:()=>SH.v[k],set:v=>{SH.v[k]=v},enumerable:false,configurable:true}));Object.defineProperty(a,'pg',{get:()=>SH.pg,set:v=>{SH.pg=v},enumerable:false,configurable:true});return a};
const adopt=(arr,leg)=>{if(leg){const f=arr.find(a=>a.s&&a.s.sek)||arr[0];if(f&&f.s)IDK.forEach(k=>{if(Object.prototype.hasOwnProperty.call(f.s,k))SH.v[k]=f.s[k]});const g=arr.find(a=>Object.prototype.hasOwnProperty.call(a,'pg')&&a.pg&&a.pg.length);if(g)SH.pg=g.pg}arr.forEach(a=>{IDK.forEach(k=>{delete a.s[k]});delete a.pg;lnk(a)})};
const fixPer=()=>ALL.forEach((a,i)=>{if(i<NS&&!a.s.per)a.s.per=SPER[i]});
const mk=(e,i)=>lnk({s:{tw:'III',thp:e?'I':'II',per:SPER[i]},rec:[{tgl:'',uraian:'Penerimaan dana BOS',jml:0}],tx:[],R:e?[]:null,SNP:e?[]:null,G:e?[]:null});
let ALL=[mk(1,0),mk(1,1)],CUR=0,S=ALL[0];calc();ALL[0].rec[0].jml=TOT;
let LEG=0;try{const x=JSON.parse(localStorage.getItem('bos_v2'));if(x&&x.all){ALL=x.all;CUR=x.cur||0;if(x.sh&&x.sh.v)SH=x.sh;else LEG=1}else{const o=JSON.parse(localStorage.getItem(K));if(o&&o.s){ALL[0]=o;LEG=1}}}catch(e){}while(ALL.length<NS)ALL.push(mk(1,ALL.length));adopt(ALL,LEG);fixPer();if(CUR>=NS)CUR=0;S=ALL[CUR]||ALL[0];calc();
const save=()=>{try{localStorage.setItem('bos_v2',JSON.stringify({all:ALL,cur:CUR,sh:SH}))}catch(e){}};
const re=i=>S.tx.reduce((a,t)=>a+(t.m?t.m.filter(x=>x[0]==i).reduce((b,x)=>b+x[1],0):t.i==i?+t.jml:0),0),RT=()=>S.tx.reduce((a,t)=>a+ +t.jml,0);
const fd=t=>t?new Date(t+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'..................';
const hari=t=>t?new Date(t+'T00:00').toLocaleDateString('id-ID',{weekday:'long'}):'........';
const ad=(d,n)=>d?new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10):'';
const T=n=>{const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];const f=n=>n<12?s[n]:n<20?f(n-10)+' belas':n<100?f(n/10|0)+' puluh '+f(n%10):n<200?'seratus '+f(n-100):n<1e3?f(n/100|0)+' ratus '+f(n%100):n<2e3?'seribu '+f(n-1e3):n<1e6?f(n/1e3|0)+' ribu '+f(n%1e3):n<1e9?f(n/1e6|0)+' juta '+f(n%1e6):f(n/1e9|0)+' miliar '+f(n%1e9);return n>0?f(Math.floor(n)).replace(/\s+/g,' ').trim()+' rupiah':'nol rupiah'};
const tc=s=>/[a-z]/.test(s)?s:s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\b(Sd|Sdn|Tk|Smp|Sma|Smk|Mi|Mts|Ma|Paud|Bos)\b/g,m=>m.toUpperCase());const nm=()=>E(S.s.sekk||tc(S.s.sek||'')||'(Nama Sekolah)');
let kop=()=>{const s=S.s;return `<div class="kop"><div style="font-size:15px;font-weight:bold">PEMERINTAH KABUPATEN ${E((s.kab||'......').toUpperCase())}</div><div style="font-size:15px;font-weight:bold">DINAS ${E((s.dinas||'......').toUpperCase())}</div><div style="font-size:18px;font-weight:bold">${nm().toUpperCase()}</div>${E(s.alamat)}${s.kec?', Kec. '+E(s.kec):''}${s.kab?', Kab. '+E(s.kab):''}${s.telp?', Telp. '+E(s.telp):''}${s.npsn?'<br>NPSN: '+E(s.npsn):''}</div>`};
const H=(t,n)=>`<h3 style="text-align:center;margin:0"><u>${t}</u></h3><p style="text-align:center;margin:0 0 12px">${n?'Nomor: '+E(n):''}</p>`;
const sign=(...a)=>`<div class="ttd">${a.map(x=>x?`<div>${x[0]}<br><br><br><br><u><b>${E(x[1]||'..................')}</b></u>${x[2]?'<br>NIP. '+E(x[2]):''}</div>`:'<div></div>').join('')}</div>`;
const KS=['Mengetahui,<br>Kepala Sekolah',S=>S.s.kep,S=>S.s.nipk];
const ks=(l)=>[l||'Kepala Sekolah',S.s.kep,S.s.nipk],bn=()=>['Bendahara BOS',S.s.ben,S.s.nipb];
const tg=t=>`${E(S.s.kota||'..........')}, ${fd(t.tgl)}`;
const ln=t=>{const h=R[t.i][6],q=t.jml/h;return Number.isInteger(q)&&q>0?[q,h]:[1,+t.jml]};
const bk=()=>{const e=[...S.rec.map(r=>({d:r.tgl,no:'-',rk:'',u:r.uraian||'Penerimaan dana BOS',a:+r.jml,b:0})),...S.tx.flatMap(t=>(t.m||[[t.i,+t.jml]]).map(([i,a])=>({d:t.tgl,no:t.no,rk:R[i][2],u:R[i][3]+(t.pen?' ('+t.pen+')':''),a:0,b:a})))];e.sort((x,y)=>(x.d||'').localeCompare(y.d||''));let s=0,A=0,B=0;
const h=e.map(x=>{s+=x.a-x.b;A+=x.a;B+=x.b;return `<tr><td>${x.d?fd(x.d):''}</td><td>${E(x.no)}</td><td>${x.rk}</td><td>${E(x.u)}</td><td class="r">${x.a?rp(x.a):''}</td><td class="r">${x.b?rp(x.b):''}</td><td class="r">${rp(s)}</td></tr>`}).join('');
return `<table><tr><th>Tanggal</th><th>No. Bukti</th><th>Kode Rekening</th><th>Uraian</th><th>Penerimaan</th><th>Pengeluaran</th><th>Saldo</th></tr>${h}<tr><th colspan="4">JUMLAH</th><th class="r">${rp(A)}</th><th class="r">${rp(B)}</th><th class="r">${rp(s)}</th></tr></table>`};
const DOC={
kw:t=>kop()+H('KWITANSI',t.no)+`<table class="nb"><tr><td width="28%">Sudah terima dari</td><td>: Bendahara BOS ${nm()}</td></tr><tr><td>Uang sejumlah</td><td>: <i style="text-transform:capitalize">${T(t.jml)}</i></td></tr><tr><td>Untuk pembayaran</td><td>: ${E(R[t.i][3])}</td></tr><tr><td>Kode rekening</td><td>: ${R[t.i][2]}</td></tr></table><p style="font-size:16px;border:2px solid #000;display:inline-block;padding:4px 14px"><b>Rp ${rp(t.jml)}</b></p><p style="text-align:right">${tg(t)}</p>`+sign(ks('Mengetahui,<br>Kepala Sekolah'),bn(),['Penerima',t.pen]),
iv:t=>{const [q,h]=ln(t);return kop()+H('INVOIS / FAKTUR',t.no)+`<p>Dari: <b>${E(t.pen||'..........')}</b><br>Kepada: <b>${nm()}</b><br>Tanggal: ${fd(t.tgl)}</p><table><tr><th>No</th><th>Uraian</th><th>Vol</th><th>Satuan</th><th>Harga Satuan</th><th>Jumlah</th></tr><tr><td>1</td><td>${E(R[t.i][3])}</td><td>${q}</td><td>${R[t.i][5]}</td><td class="r">${rp(h)}</td><td class="r">${rp(t.jml)}</td></tr><tr><th colspan="5" class="r">TOTAL</th><th class="r">${rp(t.jml)}</th></tr></table><p>Terbilang: <i style="text-transform:capitalize">${T(t.jml)}</i></p><p style="text-align:right">${tg(t)}</p>`+sign(['Penerima,<br>Bendahara BOS',S.s.ben,S.s.nipb],['Hormat kami,<br>Penyedia',t.pen])},
bt:t=>{const [q]=ln(t);return kop()+H('BERITA ACARA SERAH TERIMA (BAST)',t.no)+`<p>Pada hari ini <b>${hari(t.tgl)}</b> tanggal <b>${fd(t.tgl)}</b>, yang bertanda tangan di bawah ini:</p><table class="nb"><tr><td width="5%">1.</td><td width="12%">Nama</td><td>: ${E(t.pen||'..........')} (<b>PIHAK PERTAMA</b>, penyedia)</td></tr><tr><td>2.</td><td>Nama</td><td>: ${E(S.s.kep||'..........')}, Kepala ${nm()} (<b>PIHAK KEDUA</b>)</td></tr></table><p>PIHAK PERTAMA menyerahkan barang/pekerjaan kepada PIHAK KEDUA, dan PIHAK KEDUA menyatakan telah menerima dalam keadaan baik dan lengkap, dengan rincian:</p><table><tr><th>No</th><th>Nama Barang/Pekerjaan</th><th>Vol</th><th>Satuan</th><th>Keterangan</th></tr><tr><td>1</td><td>${E(R[t.i][3])}</td><td>${q}</td><td>${R[t.i][5]}</td><td>Baik</td></tr></table><p>Demikian berita acara ini dibuat untuk dipergunakan sebagaimana mestinya.</p>`+sign(['PIHAK KEDUA,<br>Kepala Sekolah',S.s.kep,S.s.nipk],['PIHAK PERTAMA,<br>Penyedia',t.pen])},
sp:t=>kop()+H('SURAT PERJALANAN DINAS (SPPD)','SPPD/'+t.no)+`<table>${[['Pejabat yang memberi perintah','Kepala '+nm()],['Nama pegawai yang diperintahkan',E(t.peg)],['Jabatan',E(t.jab)],['Maksud perjalanan dinas',E(R[t.i][3])],['Alat angkut','Kendaraan umum/pribadi'],['Tempat berangkat / tujuan',nm()+' / '+E(t.tuj)],['Lamanya perjalanan',t.lama+' hari'],['Tanggal berangkat / kembali',fd(t.tgl)+' / '+fd(ad(t.tgl,t.lama-1))],['Pembebanan anggaran','Dana BOS, kode rekening '+R[t.i][2]+', Rp '+rp(t.jml)],['Keterangan','-']].map((r,k)=>`<tr><td width="5%">${k+1}</td><td width="35%">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><p style="text-align:right">${tg(t)}</p>`+sign(['Pegawai yang ditugaskan',t.peg],ks('Kepala Sekolah')),
st:t=>kop()+H('SURAT TUGAS','ST/'+t.no)+`<p>Kepala ${nm()} menugaskan kepada:</p><table class="nb"><tr><td width="18%">Nama</td><td>: ${E(t.peg)}</td></tr><tr><td>Jabatan</td><td>: ${E(t.jab)}</td></tr></table><p>Untuk melaksanakan tugas: <b>${E(R[t.i][3])}</b> ke <b>${E(t.tuj)}</b> selama ${t.lama} hari, mulai tanggal ${fd(t.tgl)} s.d. ${fd(ad(t.tgl,t.lama-1))}. Biaya perjalanan dibebankan pada Dana BOS (kode rekening ${R[t.i][2]}).</p><p>Demikian surat tugas ini dibuat untuk dilaksanakan dengan penuh tanggung jawab.</p><p style="text-align:right">${tg(t)}</p>`+sign(0,ks('Kepala Sekolah')),
bk:()=>kop()+H('BUKU KAS UMUM','')+`<p style="text-align:center;margin-top:-8px">Dana BOS ${lab()} Tahun ${E(S.s.tahun)}</p>`+bk()+sign(ks('Mengetahui,<br>Kepala Sekolah'),bn()),
lap:()=>{const rc=S.rec.reduce((a,b)=>a+ +b.jml,0),rl=RT(),m=SNP.map(()=>[0,0]);R.forEach((r,i)=>{m[r[0]][0]+=N[i];m[r[0]][1]+=re(i)});
return DOC.cv()+kop()+H('LAPORAN REALISASI PENGGUNAAN DANA BOS','')+`<p style="text-align:center;margin-top:-8px">${labp()} Tahun ${E(S.s.tahun)}</p><table class="nb"><tr><td width="30%">Penerimaan dana BOS</td><td>: Rp ${rp(rc)}</td></tr><tr><td>Total pengeluaran</td><td>: Rp ${rp(rl)}</td></tr><tr><td>Saldo kas</td><td>: Rp ${rp(rc-rl)}</td></tr></table><p><b>A. Realisasi per Standar Nasional Pendidikan</b></p><table><tr><th>Standar</th><th>Rencana (RPD)</th><th>Realisasi</th><th>Sisa</th><th>%</th></tr>${m.map((a,k)=>`<tr><td>${SNP[k]}</td><td class="r">${rp(a[0])}</td><td class="r">${rp(a[1])}</td><td class="r">${rp(a[0]-a[1])}</td><td class="r">${a[0]?(a[1]/a[0]*100).toFixed(1):0}</td></tr>`).join('')}<tr><th>Total</th><th class="r">${rp(TOT)}</th><th class="r">${rp(rl)}</th><th class="r">${rp(TOT-rl)}</th><th></th></tr></table><p><b>B. Rincian per kode rekening</b></p><table><tr><th>Kode Rekening</th><th>Uraian</th><th>Rencana</th><th>Realisasi</th><th>Sisa</th></tr>${R.map((r,i)=>`<tr><td>${r[2]}</td><td>${E(r[3])}</td><td class="r">${rp(N[i])}</td><td class="r">${rp(re(i))}</td><td class="r">${rp(N[i]-re(i))}</td></tr>`).join('')}</table><p><b>C. Buku Kas Umum</b></p>${bk()}`+sign(ks('Mengetahui,<br>Kepala Sekolah'),bn())}};
const X=v=>E(v||''),row=(a,b)=>`<tr><td width="30%">${a}</td><td>: ${b}</td></tr>`,noS=t=>`${E(t.no)}/BKU/${E(S.s.sing||S.s.sek||'......')}/${lab()}/${E(S.s.tahun)}`,hd=t=>`<div style="background:#1f3864;color:#fff;font-weight:bold;padding:6px 10px;font-size:15px;margin-bottom:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact">${t}</div>`,TH=(...a)=>a.map(x=>`<th style="background:#2f5597;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact">${x}</th>`).join('');

if(u.toLowerCase()==A[x].u.toLowerCase())return setM('Username tidak boleh sama dengan akun lain.');
if(r=='b'&&!okS(u))return setM(msgS());
if(p||q){if(p.length<6)return setM('Password baru minimal 6 karakter.');if(p!=q)return setM('Ulangi password belum sama.');A[r].s=rnd();A[r].h=await hsh(p,A[r].s)}
A[r].u=u;putA(A)?(draw(),setM('Akun '+(r=='a'?'Admin':'Bendahara')+' disimpan.',1)):setM('Gagal menyimpan.')}
async function spw(){const A=getA(),o=$('#ao').value,p=$('#ap').value,q=$('#aq').value;
if(await hsh(o,A.b.s,hm(A.b.h))!=A.b.h)return setM('Password saat ini salah.');
if(p.length<6)return setM('Password baru minimal 6 karakter.');if(p!=q)return setM('Ulangi password belum sama.');
A.b.s=rnd();A.b.h=await hsh(p,A.b.s);putA(A)?(draw(),setM('Password disimpan.',1)):setM('Gagal menyimpan.')}

const rpT=a=>(a.R||[]).reduce((t,r)=>t+r[4]*r[6],0),rlT=a=>a.tx.reduce((t,x)=>t+ +x.jml,0),pc=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
VW.rg=()=>{const t=rpT(S),r=rlT(S),p=pc(r,t);return `<div class="card"><b>${E(S.s.sekk||S.s.sek||'Identitas sekolah belum diisi')}</b><div style="color:var(--m)">${SL[CUR]} · Tahun anggaran ${E(S.s.tahun)}</div><div class="st"><div><small>Total RPD</small><b>Rp ${rp(t)}</b></div><div><small>Realisasi</small><b>Rp ${rp(r)}</b></div><div><small>Sisa anggaran</small><b>Rp ${rp(t-r)}</b></div><div><small>Transaksi</small><b>${S.tx.length}</b></div></div><div class="bar2"><i style="width:${p}%"></i></div><div style="color:var(--m);margin-top:4px">${p}% terealisasi${t?'':' (RPD periode ini belum diimpor)'}</div></div><div class="card"><b>Semua periode</b><table style="margin-top:8px"><tr><th>Periode</th><th class="r">RPD</th><th class="r">Realisasi</th><th class="r">%</th></tr>${SL.map((n,i)=>{const a=ALL[i],x=rpT(a),y=rlT(a);return `<tr><td><a href="#" onclick="sw(${i});return false">${n}</a></td><td class="r">${rp(x)}</td><td class="r">${rp(y)}</td><td class="r">${pc(y,x)}%</td></tr>`}).join('')}</table></div>`};
function eyes(){document.querySelectorAll('#m input[type=password]').forEach(i=>{if(i.dataset.e)return;i.dataset.e=1;const b=document.createElement('button');b.type='button';b.className='eye';b.textContent='Lihat';b.onclick=()=>{const h=i.type=='password';i.type=h?'text':'password';b.textContent=h?'Sembunyi':'Lihat'};i.after(b)})}
function draw(){if(!ROLE){authView();eyes();return}HP=0;const al=Object.entries(TABS).filter(([k])=>ROLE=='a'||!ADM.includes(k));if(!al.some(([k])=>k==V))V='rg';$('#who').innerHTML=`<small><span>${E(S.s.sekk||S.s.sek||'Sekolah belum diisi')} · ${SL[CUR]}</span><span>${ROLE=='a'?'Admin':'Bendahara'}</span><button onclick="lo()">Keluar</button></small>`;$('#nav').innerHTML=`<select style="padding:6px;border-radius:7px" onchange="sw(+this.value)">${SL.map((n,i)=>`<option value="${i}" ${i==CUR?'selected':''}>${n}</option>`).join('')}</select>`+al.map(([k,v])=>`<button class="${k==V?'on':''}" onclick="V='${k}';draw()">${v}</button>`).join('');$('#m').innerHTML=VW[V]();if(ROLE!='a')$('#m').querySelectorAll('input[type=file]').forEach(i=>(i.closest('label')||i).remove());eyes()}
draw();
</script></body></html>
