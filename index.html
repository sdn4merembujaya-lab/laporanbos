PS=[['PASAL 1','DASAR PERJANJIAN',['1. '+E(c.dasar1)+';','2. '+E(c.dasar2)+';','3. Rencana Kegiatan dan Anggaran Sekolah (RKAS)/ARKAS '+N_+' Tahun Anggaran '+y+';','4. Kesepakatan PARA PIHAK untuk melaksanakan hubungan kerja berbasis jasa/kontrak sebagaimana diatur dalam Surat Perjanjian Kerja ini.']],

['PASAL 4','JANGKA WAKTU PERJANJIAN',['1. Perjanjian ini berlaku untuk jangka waktu '+bn_+' bulan, terhitung sejak tanggal '+fd(mu)+' sampai dengan tanggal '+fd(se)+', dan tidak melampaui Tahun Anggaran '+y+' berjalan;','2. Perjanjian ini dapat dievaluasi dan/atau diperpanjang kembali berdasarkan kesepakatan PARA PIHAK, dengan memperhatikan ketersediaan anggaran BOSP dan kinerja PIHAK KEDUA;','3. Perjanjian ini <b>sama sekali tidak</b> menimbulkan hubungan kerja yang bersifat kepegawaian, status pegawai honorer, pegawai tidak tetap, calon Aparatur Sipil Negara, maupun tenaga kerja tetap pada satuan pendidikan, Dinas '+tp(s.dinas)+', maupun Pemerintah Kabupaten '+tp(s.kab)+', dan berakhir dengan sendirinya pada saat berakhirnya jangka waktu perjanjian tanpa memerlukan pemberitahuan lebih lanjut.']],

['PASAL 6','HAK DAN KEWAJIBAN PIHAK PERTAMA',['1. PIHAK PERTAMA berhak menerima hasil pekerjaan/jasa dari PIHAK KEDUA sesuai ruang lingkup pekerjaan sebagaimana Pasal 3;','2. PIHAK PERTAMA berhak memberikan teguran, peringatan, dan/atau memutus perjanjian secara sepihak apabila PIHAK KEDUA tidak melaksanakan kewajibannya sebagaimana mestinya;','3. PIHAK PERTAMA wajib membayar imbalan jasa kepada PIHAK KEDUA sesuai dengan nilai dan mekanisme sebagaimana diatur dalam Pasal 8;','4. PIHAK PERTAMA wajib menyediakan sarana pendukung yang wajar untuk pelaksanaan tugas PIHAK KEDUA sesuai kemampuan anggaran sekolah.']],
['PASAL 7','HAK DAN KEWAJIBAN PIHAK KEDUA',['1. PIHAK KEDUA berhak menerima imbalan jasa sesuai dengan Pasal 8 atas pekerjaan yang telah dilaksanakan;','2. PIHAK KEDUA wajib melaksanakan tugas sesuai ruang lingkup pekerjaan sebagaimana Pasal 3 dengan penuh tanggung jawab, jujur, disiplin, dan menjaga nama baik satuan pendidikan;','3. PIHAK KEDUA wajib mematuhi tata tertib, kode etik, dan ketentuan lain yang berlaku di lingkungan '+N_+';','4. PIHAK KEDUA wajib segera melaporkan kepada PIHAK PERTAMA apabila terjadi kejadian, gangguan, atau hal lain yang dapat mengganggu ketertiban, kebersihan, dan/atau keamanan lingkungan sekolah;','5. PIHAK KEDUA tidak diperkenankan mengalihkan pelaksanaan tugas kepada pihak lain tanpa persetujuan tertulis dari PIHAK PERTAMA.']],
['PASAL 8','IMBALAN JASA DAN TATA CARA PEMBAYARAN',['1. PIHAK PERTAMA memberikan imbalan jasa kepada PIHAK KEDUA sesuai jenis jasa yang disepakati pada Pasal 3, dengan nilai sebagai berikut:','a. '+jn+' sebesar maksimal '+Rp+',00 ('+T(+x.t)+') per bulan;','~sesuai dengan '+E(c.dasar2)+'.','2. Imbalan jasa dibayarkan setiap bulan setelah PIHAK KEDUA melaksanakan tugas pada bulan berkenaan, dibuktikan dengan daftar hadir/laporan pelaksanaan tugas yang disetujui PIHAK PERTAMA;','3. Pembayaran dilakukan secara non-tunai (transfer ke rekening PIHAK KEDUA) atau tunai sesuai mekanisme pengelolaan keuangan BOSP yang berlaku, dan dipotong pajak sesuai ketentuan peraturan perpajakan yang berlaku, apabila ada;','4. Sumber pembiayaan imbalan jasa sebagaimana dimaksud pada ayat (1) berasal dari Dana BOSP Reguler Tahun Anggaran '+y+' pada kode rekening '+kr+' (Belanja Jasa '+(k=='s'?'Tenaga Kebersihan':'Tenaga Keamanan')+') sesuai jenis jasa yang disepakati.']],
